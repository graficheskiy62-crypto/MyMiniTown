<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniTown</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Gabriola', Georgia, serif;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            user-select: none; /* Чтобы текст не выделялся при быстрых кликах */
        }

        #balance {
            font-size: 40px;
            color: #000;
            margin-bottom: 20px;
        }

        /* Кнопка клика */
        #mainBtn {
            width: 250px;
            height: 250px;
            margin: 20px;
            cursor: pointer;
            border: 2px solid #ccc;
            border-radius: 10px;
            background: transparent;
            padding: 0;
            transition: transform 0.1s;
        }
        #mainBtn:active { transform: scale(0.96); }

        .click-image {
            width: 100%; height: 100%;
            background-color: #e8e8e8;
            background-size: cover;
            background-position: center;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: #white;
            background-image: url('https://raw.githubusercontent.com/graficheskiy62-crypto/MyMiniTown/main/image2.png')
        }

        /* Кнопки магазина */
        .shop-btn {
            font-size: 24px;
            padding: 15px 30px;
            margin: 8px;
            background-color: #f6fc7e;
            border: none;
            cursor: pointer;
            font-family: inherit;
            border-radius: 8px;
            transition: all 0.2s;
        }
        .shop-btn:hover:not(:disabled) { background-color: #d6e007; }
        .shop-btn:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
            opacity: 0.8;
        }

        /* Контейнер домов */
        .houses-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 25px;
            max-width: 1100px;
        }

        .house {
            width: 250px; height: 250px;
            background-color: #f5f5f5;
            background-size: cover;
            background-position: center;
            border-radius: 10px;
            border: 2px solid #ddd;
            display: none; /* Скрыты до покупки */
        }
      
        .h1 { background-image: url('https://raw.githubusercontent.com/graficheskiy62-crypto/MyMiniTown/main/image3.png'); }
        .h2 { background-image: url('https://raw.githubusercontent.com/graficheskiy62-crypto/MyMiniTown/main/image4.png'); }
        .h3 { background-image: url('https://raw.githubusercontent.com/graficheskiy62-crypto/MyMiniTown/refs/image5.png'); }
        .h4 { background-image: url('https://raw.githubusercontent.com/graficheskiy62-crypto/MyMiniTown/main/IMAGE6.png'); }
        .h5 { background-image: url('https://raw.githubusercontent.com/graficheskiy62-crypto/MyMiniTown/main/png10.png'); }
    </style>
</head>
<body>
    <div id="balance">Баланс: 0</div>
    
    <button id="mainBtn">
        <div class="click-image"> </div>
    </button>

    <button id="shopBtn" class="shop-btn">Купить 10</button>
    <button id="shopHomeBtn" class="shop-btn">Купить дом 100</button>

    <div class="houses-container">
        <div id="house1" class="house h1"></div>
        <div id="house2" class="house h2"></div>
        <div id="house3" class="house h3"></div>
        <div id="house4" class="house h4"></div>
        <div id="house5" class="house h5"></div>
    </div>

    <script>
        let money = 0;
        let clickPower = 1;
        let upgradeCost = 10;
        let h1 = false, h2 = false, h3 = false, h4 = false, h5 = false;

        const balanceEl = document.getElementById('balance');
        const shopBtn = document.getElementById('shopBtn');
        const shopHomeBtn = document.getElementById('shopHomeBtn');

        // ✅ Исправлено: функция переименована, чтобы не конфликтовать с браузером
        function doClick() {
            money += clickPower;
            updateUI();
        }

        function buyUpgrade() {
            if (money >= upgradeCost) {
                money -= upgradeCost;
                clickPower++;
                upgradeCost += 10;
                updateUI();
            }
        }

        function buyHome() {
            if (money >= 100 && !h1) {
                document.getElementById('house1').style.display = 'block';
                money -= 100; // ✅ Исправлено: в оригинале вычиталось 10 вместо 100
                h1 = true;
                shopHomeBtn.textContent = 'Купить торговый центр 200';
            } else if (money >= 200 && !h2) {
                document.getElementById('house2').style.display = 'block';
                money -= 200;
                h2 = true;
                shopHomeBtn.textContent = 'Купить дом 300';
            } else if (money >= 300 && !h3) {
                document.getElementById('house3').style.display = 'block';
                money -= 300;
                h3 = true;
                shopHomeBtn.textContent = 'Купить небоскреб 500';
            } else if (money >= 500 && !h4) {
                document.getElementById('house4').style.display = 'block';
                money -= 500;
                h4 = true;
                shopHomeBtn.textContent = 'Купить банк 1000';
            } else if (money >= 1000 && !h5) {
                document.getElementById('house5').style.display = 'block';
                money -= 1000;
                h5 = true;
                shopHomeBtn.style.display = 'none'; // Кнопка исчезает после последнего дома
            }
            updateUI(); // ✅ Добавлено: обновление баланса сразу после покупки
        }

        function updateUI() {
            balanceEl.textContent = `Баланс: ${money}`;
            if (money >= upgradeCost) {
                shopBtn.disabled = false;
                shopBtn.textContent = `Купить ${upgradeCost}`;
            } else {
                shopBtn.disabled = true;
                shopBtn.textContent = `Нужно (${upgradeCost})`;
            }
        }

        // Привязываем события через JS (надёжнее, чем onclick в HTML)
        document.getElementById('mainBtn').addEventListener('click', doClick);
        shopBtn.addEventListener('click', buyUpgrade);
        shopHomeBtn.addEventListener('click', buyHome);

        updateUI();
    </script>
</body>
</html>
