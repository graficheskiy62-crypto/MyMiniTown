<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniTown</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Gabriola', Georgia, serif;
            background-color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .balance {
            font-size: 40px;
            color: #000000;
            margin-bottom: 20px;
        }

        .click-button {
            width: 250px;
            height: 250px;
            margin: 20px;
            cursor: pointer;
            border: none;
            background-color: white;
            transition: transform 0.1s;
        }

        .click-button:active {
            transform: scale(0.95);
        }

        /* ЗАГЛУШКА ДЛЯ ГЛАВНОЙ КНОПКИ - замените на: background-image: url('image2.png'); */
        .click-button-image {
            width: 100%;
            height: 100%;
            background-color: #e0e0e0;
            background-image: url('image2.png'); /* ЗАМЕНИТЬ НА ВАШУ КАРТИНКУ */
            background-size: cover;
            background-position: center;
            border-radius: 10px;
        }

        .shop-button {
            font-size: 24px;
            padding: 15px 30px;
            margin: 10px;
            background-color: #f6fc7e;
            border: none;
            cursor: pointer;
            font-family: 'Gabriola', Georgia, serif;
            border-radius: 8px;
            transition: background-color 0.3s;
        }

        .shop-button:hover:not(:disabled) {
            background-color: #d6e007;
        }

        .shop-button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }

        .shop-home-button {
            font-size: 24px;
            padding: 15px 30px;
            margin: 10px;
            background-color: #f6fc7e;
            border: none;
            cursor: pointer;
            font-family: 'Gabriola', Georgia, serif;
            border-radius: 8px;
            transition: background-color 0.3s;
        }

        .shop-home-button:hover:not(:disabled) {
            background-color: #d6e007;
        }

        .houses-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            max-width: 1000px;
        }

        .house-label {
            width: 250px;
            height: 250px;
            /* ЗАГЛУШКИ ДЛЯ ДОМОВ */
            background-color: #f0f0f0;
            background-size: cover;
            background-position: center;
            border-radius: 10px;
            display: none; /* Скрыты по умолчанию */
        }

        /* ЗАМЕНИТЕ background-image НА ВАШИ КАРТИНКИ */
        .house1 { background-image: url('image3.png'); } /* ЗАМЕНИТЬ НА image3.png */
        .house2 { background-image: url('image4.png'); } /* ЗАМЕНИТЬ НА image4.png */
        .house3 { background-image: url('image5.png'); } /* ЗАМЕНИТЬ НА image5.png */
        .house4 { background-image: url('IMAGE6.png'); } /* ЗАМЕНИТЬ НА IMAGE6.png */
        .house5 { background-image: url('png10.png'); } /* ЗАМЕНИТЬ НА png10.png */

        .house-label.visible {
            display: block;
        }
    </style>
</head>
<body>
    <div class="balance" id="balance">Баланс: 0</div>
    
    <button class="click-button" onclick="click()">
        <div class="click-button-image"></div>
    </button>

    <button class="shop-button" id="shopBtn" onclick="buy()">
        Купить 10
    </button>

    <button class="shop-home-button" id="shopHomeBtn" onclick="buyHome()">
        Купить дом 100
    </button>

    <div class="houses-container">
        <div class="house-label house1" id="house1"></div>
        <div class="house-label house2" id="house2"></div>
               <div class="house-label house3" id="house3"></div>
        <div class="house-label house4" id="house4"></div>
        <div class="house-label house5" id="house5"></div>
    </div>

    <script>
        // Переменные
        let money = 0;
        let clickPower = 1;
        let upgradeCost = 10;
        let upgradeCost2 = 100;
        
        let h1 = false, h2 = false, h3 = false, h4 = false, h5 = false;

        // Функция клика
        function click() {
            money += clickPower;
            update();
            console.log(money);
        }

        // Покупка улучшения
        function buy() {
            if (money >= upgradeCost) {
                money -= upgradeCost;
                clickPower += 1;
                upgradeCost += 10;
                update();
            }
        }

        // Покупка домов
        function buyHome() {
            if (money >= 100 && !h1) {
                document.getElementById('house1').classList.add('visible');
                money -= 10;
                h1 = true;
                document.getElementById('shopHomeBtn').textContent = 'Купить торговый центр 200';
            }
            else if (money >= 200 && !h2) {
                document.getElementById('house2').classList.add('visible');
                money -= 20;
                h2 = true;
                document.getElementById('shopHomeBtn').textContent = 'Купить дом 300';
            }
            else if (money >= 300 && !h3) {
                document.getElementById('house3').classList.add('visible');
                money -= 300;
                h3 = true;
                document.getElementById('shopHomeBtn').textContent = 'Купить небоскреб 500';
            }
            else if (money >= 500 && !h4) {
                document.getElementById('house4').classList.add('visible');
                money -= 500;
                h4 = true;
                document.getElementById('shopHomeBtn').textContent = 'Купить банк 1000';
            }
            else if (money >= 1000 && !h5) {
                document.getElementById('house5').classList.add('visible');
                money -= 1000;
                h5 = true;
                document.getElementById('shopHomeBtn').style.display = 'none';
            }
            update();
        }

        // Обновление интерфейса
        function update() {
            document.getElementById('balance').textContent = `Баланс: ${money}`;
            
            const shopBtn = document.getElementById('shopBtn');
            if (money >= upgradeCost) {
                shopBtn.disabled = false;
                shopBtn.textContent = `Купить ${upgradeCost}`;
            } else {
                shopBtn.disabled = true;
                shopBtn.textContent = `Нужно (${upgradeCost})`;
            }
        }

        // Инициализация
        update();
    </script>
</body>
</html>
